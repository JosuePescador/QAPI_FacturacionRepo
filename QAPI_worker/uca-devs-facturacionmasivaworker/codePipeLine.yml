AWSTemplateFormatVersion: 2010-09-09
Description: The CloudFormation template for Pipeline FacturacionMasiva - Generación de jar.

Parameters:
  Stage:
    Type: String
    Default: uca-devs-facturacionmasivaworker
  BranchName:
    Description: CodeCommit branch 
    Type: String
    Default: master
  RepositoryName:
    Description: CodeCommit repository name
    Type: String
    Default: QAPI_FacturacionMasivaWorker
  AccountBId:
    Description: Id de la cuenta donde se encuentra el codigo fuente
    Type: String
    Default: 624097007419
  AccountAId:
    Description: Id de la cuenta donde se ejecutara el pipeline
    Type: String
    Default: 225711149285
  RoleCrossAccountCodeB:
    Description: Role que permite interatuar con codecommit desde la otra cuenta
    Type: String
    Default: arn:aws:iam::624097007419:role/CrossAccountCodeCommit
  KMSCrossAccountArn:
    Description: arn de la llave que encripta información entre cuentas
    Type: String
    Default: arn:aws:kms:us-east-1:225711149285:key/749e1335-4e11-4bc6-9f11-efd929920374
  TagName:
    Type: String
    Default: uca-devs-facturacionmasivaworker
  TagEnv:
    Type: String
    Default: DEVS
  TagProjectId:
    Type: String
    Default: P0322
  TagClient:
    Type: String
    Default: UCA

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Join ['-', [!Ref Stage, 'ecr']]
      Tags:
          - Key: Name
            Value: !Ref TagName
          - Key: Env
            Value: !Ref TagEnv
          - Key: ProjectId
            Value: !Ref TagProjectId
          - Key: Client
            Value: !Ref TagClient

  # Create an S3 Bucket to store build artifacts
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-', [!Ref Stage, 's3']]
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  S3BuckeyPolicie:
    DependsOn: S3Bucket
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Join ['', [!Ref Stage,'-', 's3']]
      PolicyDocument:
        Version: '2012-10-17'
        Id: !Join ['-', [!Ref Stage, 's3bucket-Policie']]
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              AWS:
                - !Join ['', ['arn:aws:iam::',!Ref AccountBId, ':root']]
                - !Join ['', ['arn:aws:iam::',!Ref AccountAId, ':root']]
            Action:
              - s3:Get*
              - s3:Put*
            Resource: !Join ['', ['arn:aws:s3:::',!Ref Stage,'-', 's3', '/*']]
          - Sid: ''
            Effect: Allow
            Principal:
              AWS: !Join ['', ['arn:aws:iam::',!Ref AccountBId, ':root']]
            Action: s3:ListBucket
            Resource: !Join ['', ['arn:aws:s3:::',!Ref Stage,'-', 's3']]

  # Create Access Role for CodePipeLine
  CodePipeLineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  # Create Access Role for CodeBuild
  CodeBuildExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  # Create Access Role for Cloudformation
  CloudformationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  AmazonCloudWatchEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: cwe-pipeline-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodePipeLine ] ] 
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  # Create the BuildProject with required Build information
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties: 
      Artifacts: 
        Type: CODEPIPELINE
      Environment: 
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:2.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: True
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Value: !Join [ ".", [ !Ref "AWS::AccountId", "dkr.ecr", !Ref "AWS::Region", !Join [ "/", [ "amazonaws.com", !Ref "ECRRepository" ] ] ] ]
      Name: !Join ['-', [!Ref Stage, 'BuildProject']]
      ServiceRole: !Ref CodeBuildExecutionRole
      Source:
        Type: CODEPIPELINE
        # This file (buildspec.yml In Source code) contains commands to Create and Push a docker image to the ECR_REPOSITORY_URI
        BuildSpec: buildspec.yml
      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient

  # Create CodePipeline with 3 stages (Source, Build and Deploy)
  CodePipeLine:
    Type: AWS::CodePipeline::Pipeline
    DependsOn: S3Bucket
    Properties: 
      ArtifactStore: 
        Location: !Join ['-', [!Ref Stage, 's3']]
        Type: S3
        EncryptionKey:
          Id: !Ref KMSCrossAccountArn
          Type: KMS
      Name: !Join ['-', [!Ref Stage, 'CodePipeLine']]
      RestartExecutionOnUpdate: False
      RoleArn: 
        Fn::GetAtt: [ CodePipeLineExecutionRole, Arn ]
        
      Stages:
        # Download source code from Github Repo to source-output-artifacts path in S3 Bucket
        - Name: Source
          Actions: 
            - Name: SourceCode
              ActionTypeId: 
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: 1
              Configuration:
                RepositoryName: !Ref RepositoryName
                BranchName: !Ref BranchName
                PollForSourceChanges: true
              RunOrder: 1
              RoleArn: !Ref RoleCrossAccountCodeB
              OutputArtifacts:
                - Name: source-output-artifacts-code
          
        # Build the project using the BuildProject and Output build artifacts to build-output-artifacts path in S3 Bucket
        - Name: Build
          Actions:
          - Name: Build
            ActionTypeId:
              Category: Build
              Owner: AWS
              Version: 1
              Provider: CodeBuild
            OutputArtifacts:
              - Name: build-output-artifacts
            InputArtifacts:
              - Name: source-output-artifacts-code
            Configuration:
                ProjectName: !Ref BuildProject
            RunOrder: 1

      Tags:
        - Key: Name
          Value: !Ref TagName
        - Key: Env
          Value: !Ref TagEnv
        - Key: ProjectId
          Value: !Ref TagProjectId
        - Key: Client
          Value: !Ref TagClient


  AmazonCloudWatchEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - 'CodeCommit Repository State Change'
        resources:
          - !Join [ '', [ 'arn:aws:codecommit:', !Ref 'AWS::Region', ':', !Ref AccountBId , ':', !Ref RepositoryName ] ]
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref BranchName
      Targets:
        -
          Arn: 
            !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodePipeLine ] ]
          RoleArn: !GetAtt AmazonCloudWatchEventRole.Arn
          Id: codepipeline-AppPipeline