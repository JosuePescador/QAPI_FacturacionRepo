name: Deploy to Test Environment

on:
  push:
    branches:
      - develop
      - modules
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build QAPI_masiva
        run: |
          cd QAPI_masiva
          mvn clean package -DskipTests -P test
          cd ..

      - name: Build QAPI_worker
        run: |
          cd QAPI_worker
          mvn clean package -DskipTests -P test
          cd ..

      - name: Create deployment artifacts
        run: |
          mkdir -p deployment
          cp QAPI_masiva/target/QAPI_FacturacionMasiva-1.1.1.jar deployment/ || true
          cp QAPI_worker/target/QAPI_FacturacionMasivaWorker-1.1.0.jar deployment/ || true
          cp docker-compose.yml deployment/ || true
          cp init-localstack.sh deployment/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment
          path: deployment/

      - name: Start LocalStack
        run: |
          echo "🚀 Starting LocalStack..."
          docker compose up -d localstack
          sleep 10
          
          echo "⏳ Waiting for LocalStack to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1; then
              echo "✅ LocalStack is ready"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Initialize LocalStack resources
        run: |
          echo "🔧 Initializing LocalStack resources..."
          chmod +x init-localstack.sh
          bash init-localstack.sh || echo "⚠️  Init script failed, continuing..."
          
          echo "📋 Verifying resources..."
          aws --endpoint-url=http://localhost:4566 sqs list-queues --region us-east-1 || true
          aws --endpoint-url=http://localhost:4566 dynamodb list-tables --region us-east-1 || true

      - name: Start QAPI Services
        run: |
          echo "🚀 Starting QAPI_masiva..."
          cd QAPI_masiva
          nohup java -jar target/QAPI_FacturacionMasiva-1.1.1.jar --spring.profiles.active=dev > ../masiva.log 2>&1 &
          echo $! > ../masiva.pid
          cd ..
          
          echo "🚀 Starting QAPI_worker..."
          cd QAPI_worker
          nohup java -jar target/QAPI_FacturacionMasivaWorker-1.1.0.jar --spring.profiles.active=dev > ../worker.log 2>&1 &
          echo $! > ../worker.pid
          cd ..
          
          echo "⏳ Waiting for services to start..."
          sleep 20

      - name: Health Checks
        run: |
          echo "🔍 Running health checks..."
          
          # Check QAPI_masiva
          echo "Checking QAPI_masiva (port 8080)..."
          for i in {1..30}; do
            MASIVA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            if [ "$MASIVA_STATUS" = "200" ]; then
              echo "✅ QAPI_masiva is healthy"
              break
            fi
            echo "  Waiting for QAPI_masiva... ($i/30) HTTP $MASIVA_STATUS"
            sleep 3
          done
          
          if [ "$MASIVA_STATUS" != "200" ]; then
            echo "❌ QAPI_masiva failed to start"
            echo "📜 Last 50 lines of masiva.log:"
            tail -50 masiva.log || true
            exit 1
          fi
          
          # Check QAPI_worker (es un SQS listener, no tiene endpoints REST)
          echo "Checking QAPI_worker (SQS listener)..."
          
          # Verificar que el proceso arrancó correctamente buscando el mensaje de inicio
          if grep -q "Started QapiFacturacionMasivaWorkerApplication" worker.log; then
            echo "✅ QAPI_worker started successfully"
            
            # Verificar que el SQS listener container se inicializó
            if grep -q "sqsListenerEndpointContainer.*started" worker.log; then
              echo "✅ QAPI_worker SQS listener container is running"
            else
              echo "⚠️  SQS listener container may not be started yet"
            fi
          else
            echo "❌ QAPI_worker failed to start"
            echo "📜 Last 50 lines of worker.log:"
            tail -50 worker.log || true
            exit 1
          fi
          
          # Check LocalStack
          echo "Checking LocalStack (port 4566)..."
          LOCALSTACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4566/_localstack/health || echo "000")
          if [ "$LOCALSTACK_STATUS" = "200" ]; then
            echo "✅ LocalStack is healthy"
          else
            echo "⚠️  LocalStack may not be healthy (HTTP $LOCALSTACK_STATUS)"
          fi
          
          echo ""
          echo "🎉 Health checks completed!"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          if [ -f masiva.pid ]; then
            kill $(cat masiva.pid) 2>/dev/null || true
          fi
          if [ -f worker.pid ]; then
            kill $(cat worker.pid) 2>/dev/null || true
          fi
          docker-compose down || true

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✓ Deploy workflow completed (check logs for deploy or skip)"
          else
            echo "✗ Deploy workflow failed"
          fi
