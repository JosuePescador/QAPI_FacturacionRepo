name: Deploy to Test Environment

on:
  push:
    branches:
      - develop
      - modules
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build QAPI_masiva
        run: |
          cd QAPI_masiva
          mvn clean package -DskipTests -P test
          cd ..

      - name: Build QAPI_worker
        run: |
          cd QAPI_worker
          mvn clean package -DskipTests -P test
          cd ..

      - name: Create deployment artifacts
        run: |
          mkdir -p deployment
          cp QAPI_masiva/target/QAPI_FacturacionMasiva-1.1.1.jar deployment/ || true
          cp QAPI_worker/target/QAPI_FacturacionMasivaWorker-1.1.0.jar deployment/ || true
          cp docker-compose.yml deployment/ || true
          cp init-localstack.sh deployment/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment
          path: deployment/

      - name: Deploy to Test Server (conditional inside)
        env:
          TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          TEST_SERVER_KEY: ${{ secrets.TEST_SERVER_KEY }}
        run: |
          if [ -z "${TEST_SERVER_HOST}" ]; then
            echo "TEST_SERVER_HOST not configured, skipping remote deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${TEST_SERVER_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${TEST_SERVER_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -r deployment/* ${TEST_SERVER_USER}@${TEST_SERVER_HOST}:/opt/qapi/test/ || true
          ssh ${TEST_SERVER_USER}@${TEST_SERVER_HOST} << 'EOF'
            set -e
            cd /opt/qapi/test || exit 0
            docker-compose down || true
            docker-compose up -d || true
            sleep 10
            bash init-localstack.sh || true
          EOF

      - name: Health Check on Remote Server
        env:
          TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          TEST_SERVER_KEY: ${{ secrets.TEST_SERVER_KEY }}
        run: |
          if [ -z "${TEST_SERVER_HOST}" ]; then
            echo "⚠️  No remote server configured - skipping health checks"
            exit 0
          fi
          
          echo "🔍 Checking health of services on ${TEST_SERVER_HOST}..."
          
          mkdir -p ~/.ssh
          echo "${TEST_SERVER_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${TEST_SERVER_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Execute health checks on remote server
          ssh ${TEST_SERVER_USER}@${TEST_SERVER_HOST} << 'EOF'
            set -e
            
            echo "Waiting for services to be ready..."
            sleep 15
            
            # Check QAPI_masiva
            echo "Checking QAPI_masiva (port 8080)..."
            MASIVA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            if [ "$MASIVA_STATUS" = "200" ]; then
              echo "✅ QAPI_masiva is healthy"
            else
              echo "❌ QAPI_masiva is not healthy (HTTP $MASIVA_STATUS)"
              exit 1
            fi
            
            # Check QAPI_worker
            echo "Checking QAPI_worker (port 8081)..."
            WORKER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
            if [ "$WORKER_STATUS" = "200" ]; then
              echo "✅ QAPI_worker is healthy"
            else
              echo "❌ QAPI_worker is not healthy (HTTP $WORKER_STATUS)"
              exit 1
            fi
            
            # Check LocalStack
            echo "Checking LocalStack (port 4566)..."
            LOCALSTACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4566/_localstack/health || echo "000")
            if [ "$LOCALSTACK_STATUS" = "200" ]; then
              echo "✅ LocalStack is healthy"
            else
              echo "⚠️  LocalStack may not be healthy (HTTP $LOCALSTACK_STATUS)"
            fi
            
            echo ""
            echo "🎉 All critical services are healthy!"
          EOF

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✓ Deploy workflow completed (check logs for deploy or skip)"
          else
            echo "✗ Deploy workflow failed"
          fi
