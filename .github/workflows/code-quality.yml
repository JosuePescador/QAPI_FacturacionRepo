name: Code Quality & Build

on:
  push:
    branches:
      - main
      - develop
      - modules
      - actions
  pull_request:
    branches:
      - main
      - develop
      - modules
      - actions

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Terraform fmt/validate (infra/terraform)
        run: |
          if [ -d infra/terraform ]; then
            cd infra/terraform
            terraform init -input=false
            terraform fmt -check || true
            terraform validate || true
            cd -
          else
            echo "No infra/terraform directory found, skipping Terraform validation"
          fi

      - name: Build QAPI_masiva (skip tests)
        run: |
          cd QAPI_masiva
          mvn clean verify -DskipTests
          cd ..

      - name: Build QAPI_worker (skip tests)
        run: |
          cd QAPI_worker
          mvn clean verify -DskipTests
          cd ..

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            QAPI_masiva/target/site/
            QAPI_worker/target/site/
