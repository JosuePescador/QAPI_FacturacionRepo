name: Test Environment CI

on:
  push:
    branches:
      - main
      - develop
      - scripts
  pull_request:
    branches:
      - main
      - develop
      - scripts

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,dynamodb,s3
          DEBUG: 1
          DATA_DIR: /tmp/localstack
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure AWS credentials for LocalStack
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Wait for LocalStack to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Initialize LocalStack resources
        run: |
          chmod +x init-localstack.sh
          ./init-localstack.sh

      - name: Build QAPI_masiva
        run: |
          cd QAPI_masiva
          mvn clean package -DskipTests
          cd ..

      - name: Build QAPI_worker
        run: |
          cd QAPI_worker
          mvn clean package -DskipTests
          cd ..

      - name: Run QAPI_masiva in background
        run: |
          cd QAPI_masiva
          java -jar target/QAPI_FacturacionMasiva-1.1.1.jar --spring.profiles.active=dev &
          cd ..
          sleep 15
          curl http://localhost:8080/actuator/health || true

      - name: Run QAPI_worker in background
        run: |
          cd QAPI_worker
          java -jar target/QAPI_FacturacionMasivaWorker-1.1.0.jar --spring.profiles.active=dev &
          cd ..
          sleep 15
          curl http://localhost:8081/actuator/health || true

      - name: Run End-to-End Tests
        run: |
          chmod +x test-e2e.sh
          ./test-e2e.sh
        env:
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}

      - name: Verify DynamoDB data
        run: |
          echo "=== InfoRequest Table ==="
          aws --endpoint-url=http://localhost:4566 dynamodb scan \
            --table-name InfoRequest --region us-east-1 | jq '.Items'
          
          echo ""
          echo "=== InfoRequestProcessing Table ==="
          aws --endpoint-url=http://localhost:4566 dynamodb scan \
            --table-name InfoRequestProcessing --region us-east-1 | jq '.Items'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            QAPI_masiva/target/
            QAPI_worker/target/

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Test environment CI failed. Check logs above."
