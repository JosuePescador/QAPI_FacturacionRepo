name: Local E2E - QAPI Facturación Masiva
 
on:
  push:
    branches:
      - main
      - develop
      - modules
      - actions
  pull_request:
    branches:
      - main
      - develop
      - actions
  workflow_dispatch: {}
 
jobs:
  local-e2e:
    name: Local E2E (LocalStack + Terraform + Setup)
    runs-on: ubuntu-latest
    timeout-minutes: 45
 
    env:
      # Credenciales falsas para LocalStack
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
 
      # Por defecto usamos token falso en los tests E2E
      USE_FAKE_TOKEN: "true"
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Mostrar versiones
        run: |
          java -version
          terraform -version
          docker --version
 
      - name: Ejecutar setup local completo (infra + IaC + build + deploy + tests)
        run: |
          chmod +x setup.sh
          ./setup.sh
 
      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qapi-local-e2e-logs
          path: |
            log-masiva.out
            log-worker.out
          if-no-files-found: ignore
 